name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布到 Release 的标签，例如 v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build binaries
        run: |
          mkdir -p dist
          bun build ./src/index.ts --compile --target=bun-windows-x64 --outfile dist/tgb-windows-x64.exe
          bun build ./src/index.ts --compile --target=bun-linux-x64 --outfile dist/tgb-linux-x64
          bun build ./src/index.ts --compile --target=bun-linux-arm64 --outfile dist/tgb-linux-arm64
          bun build ./src/index.ts --compile --target=bun-darwin-arm64 --outfile dist/tgb-darwin-arm64
          bun build ./src/index.ts --compile --target=bun-darwin-x64 --outfile dist/tgb-darwin-x64
          cd dist
          sha256sum tgb-windows-x64.exe tgb-linux-x64 tgb-linux-arm64 tgb-darwin-arm64 tgb-darwin-x64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: tgb-cli ${{ inputs.tag || github.ref_name }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/tgb-windows-x64.exe
            dist/tgb-linux-x64
            dist/tgb-linux-arm64
            dist/tgb-darwin-arm64
            dist/tgb-darwin-x64
            dist/SHA256SUMS.txt
